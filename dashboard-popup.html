<html lang="th">
<head>

<title>โรงเรือนอบแห้งพลังงานแสงอาทิตย์ร่วมกับเชื้อเพลิงชีวมวล</title>
<style>
  :root{
    --bg:#12151a;
    --panel:#1b2028;
    --line:rgba(237,235,227,.09);
    --line-2:rgba(237,235,227,.16);
    --text:#edebe3;
    --text-dim:#98a1ac;
    --amber:#f5a623;
  }
  *{box-sizing:border-box;}
  body{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(circle at 82% 8%, rgba(245,166,35,.10), transparent 46%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    padding: 24px;
  }

  .intro-eyebrow{
    font-family: 'Share Tech Mono', monospace;
    font-size: 12.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 14px;
  }

  h1{
    font-size: clamp(20px, 3vw, 30px);
    max-width: 620px;
    line-height: 1.4;
    margin: 0 0 8px;
  }
  h1 em{ font-style: normal; color: var(--amber); }

  .intro-sub{
    color: var(--text-dim);
    font-size: 14px;
    max-width: 480px;
    margin-bottom: 34px;
  }

  .open-btn {
    padding: 15px 30px;
    background-color: var(--amber);
    color: #1a1406;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(245,166,35,.25);
    transition: 0.2s;
  }
  .open-btn:hover {
    background-color: #ffb640;
    transform: translateY(-2px);
  }
  .open-btn:active{ transform: translateY(0); }

  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(2px);
  }
  .modal.show{ display: block; }

  .modal-content {
    position: relative;
    margin: 2vh auto;
    width: 96%;
    max-width: 1280px;
    height: 96vh;
    background-color: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .close-btn {
    position: absolute;
    top: 12px;
    right: 18px;
    color: #fff;
    font-size: 32px;
    line-height: 1;
    font-weight: bold;
    cursor: pointer;
    z-index: 1001;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0,0,0,.35);
    transition: background .15s, color .15s;
  }
  .close-btn:hover { color: #e85c4a; background: rgba(0,0,0,.55); }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #12151a;
  }
</style>
</head>
<body>

  <div class="intro-eyebrow">Solar–Biomass Dryer · Monitoring System</div>
  <h1>โรงเรือนอบแห้งพลังงาน<em>แสงอาทิตย์</em>ร่วมกับเชื้อเพลิงชีวมวล</h1>
  <p class="intro-sub">คลิกปุ่มด้านล่างเพื่อเปิดแดชบอร์ดตรวจวัดข้อมูลเซนเซอร์แบบเรียลไทม์ในหน้าต่างป๊อปอัป</p>

  <button id="openModalBtn" class="open-btn">เปิดแดชบอร์ดเตาอบชีวมวล</button>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeBtn" title="ปิด">&times;</span>
      <iframe id="dashFrame" title="Solar-Biomass Dryer Dashboard"></iframe>
    </div>
  </div>

<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โรงเรือนอบแห้งพลังงานแสงอาทิตย์ร่วมกับเชื้อเพลิงชีวมวล — Hybrid Solar‑Biomass Dryer</title>
<meta name="description" content="ปริญญานิพนธ์ วิศวกรรมเครื่องกล มทร.อีสาน วิทยาเขตสุรินทร์ — โรงเรือนอบแห้งพลังงานแสงอาทิตย์ร่วมกับเชื้อเพลิงชีวมวล พร้อมแดชบอร์ดตรวจวัดข้อมูลเซนเซอร์">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;family=Share+Tech+Mono&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12151a;
  --bg-2:#0d0f13;
  --panel:#1b2028;
  --panel-2:#212832;
  --line:rgba(237,235,227,.09);
  --line-2:rgba(237,235,227,.16);
  --text:#edebe3;
  --text-dim:#98a1ac;
  --amber:#f5a623;
  --amber-dim:rgba(245,166,35,.14);
  --green:#6f9a6a;
  --green-dim:rgba(111,154,106,.16);
  --phosphor:#7cffb2;
  --phosphor-dim:rgba(124,255,178,.13);
  --red:#e85c4a;
  --red-dim:rgba(232,92,74,.15);
  --blue:#6badea;
  --blue-dim:rgba(107,173,234,.14);
  --radius:12px;
  --font-display:'Chakra Petch','IBM Plex Sans Thai',sans-serif;
  --font-body:'IBM Plex Sans Thai',sans-serif;
  --font-mono:'Share Tech Mono',monospace;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;letter-spacing:.01em;}
p{margin:0;}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px;}
.eyebrow{
  font-family:var(--font-mono);
  font-size:12.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--amber);
  display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";width:22px;height:1px;background:var(--amber);display:inline-block;}
::selection{background:var(--phosphor-dim);color:var(--phosphor);}

/* ---------- NAV ---------- */
header.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(18,21,26,.82);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.nav-inner{
  max-width:1180px;margin:0 auto;padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:15px;white-space:nowrap;}
.brand-mark{width:28px;height:28px;flex:none;}
.brand small{display:block;font-family:var(--font-mono);font-weight:400;font-size:10px;color:var(--text-dim);letter-spacing:.08em;}
nav.links{display:flex;gap:26px;overflow-x:auto;scrollbar-width:none;}
nav.links::-webkit-scrollbar{display:none;}
nav.links a{
  font-size:13.5px;color:var(--text-dim);text-decoration:none;white-space:nowrap;
  padding:6px 2px;border-bottom:1px solid transparent;transition:color .15s,border-color .15s;
}
nav.links a:hover{color:var(--text);border-color:var(--amber);}
.live-badge{
  display:flex;align-items:center;gap:8px;flex:none;
  font-family:var(--font-mono);font-size:11.5px;color:var(--phosphor);
  border:1px solid var(--line-2);border-radius:99px;padding:6px 12px;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 8px var(--phosphor);animation:pulse 2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

/* ---------- HERO ---------- */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(circle at 82% 8%, rgba(245,166,35,.10), transparent 46%),
    repeating-linear-gradient(0deg, var(--line) 0 1px, transparent 1px 64px),
    repeating-linear-gradient(90deg, var(--line) 0 1px, transparent 1px 64px),
    var(--bg-2);
  border-bottom:1px solid var(--line);
}
.hero-inner{
  max-width:1180px;margin:0 auto;padding:76px 28px 56px;
  display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:center;
}
.hero h1{font-size:clamp(28px,4vw,44px);line-height:1.18;margin:16px 0 10px;}
.hero h1 em{font-style:normal;color:var(--amber);}
.hero .sub{font-family:var(--font-mono);font-size:14px;color:var(--text-dim);letter-spacing:.04em;margin-bottom:22px;}
.hero p.lead{color:var(--text-dim);max-width:52ch;margin-bottom:28px;font-size:15.5px;}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;}
.btn{
  font-family:var(--font-body);font-weight:600;font-size:14px;
  padding:12px 22px;border-radius:8px;border:1px solid transparent;
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;
  transition:transform .15s, background .15s, border-color .15s, color .15s;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--amber);color:#1a1406;}
.btn-primary:hover{background:#ffb640;}
.btn-ghost{border-color:var(--line-2);color:var(--text);}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber);}

.blueprint-frame{position:relative;border:1px solid var(--line-2);border-radius:var(--radius);background:linear-gradient(180deg,#181d24,#141820);padding:18px;}
.blueprint-frame::before{
  content:"FIG. 3.15 — SOLIDWORKS MODEL";
  position:absolute;top:-11px;left:16px;background:var(--bg-2);
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;color:var(--text-dim);padding:0 8px;
}
.blueprint-img-wrap{position:relative;border-radius:8px;overflow:hidden;background:#eceff1;}
.blueprint-img-wrap img{width:100%;}
.callout{
  position:absolute;font-family:var(--font-mono);font-size:10.5px;color:var(--phosphor);
  background:rgba(13,15,19,.82);border:1px solid rgba(124,255,178,.35);
  padding:3px 8px;border-radius:99px;white-space:nowrap;transform:translate(-50%,-50%);
}
.callout::after{content:"";position:absolute;width:6px;height:6px;border-radius:50%;background:var(--phosphor);box-shadow:0 0 6px var(--phosphor);}
.callout.c1::after{left:-3px;top:50%;transform:translateY(-50%);}
.callout.c2::after{right:-3px;top:50%;transform:translateY(-50%);}
.blueprint-caption{display:flex;justify-content:space-between;margin-top:14px;font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);letter-spacing:.04em;}

/* ---------- TICKER ---------- */
.ticker{border-bottom:1px solid var(--line);background:var(--bg-2);}
.ticker-inner{
  max-width:1180px;margin:0 auto;padding:13px 28px;
  display:flex;flex-wrap:wrap;gap:10px 34px;align-items:center;
  font-family:var(--font-mono);font-size:12px;color:var(--text-dim);
}
.ticker-inner b{color:var(--amber);font-weight:400;}
.ticker-tag{font-size:10.5px;color:var(--text-dim);opacity:.7;letter-spacing:.06em;}

/* ---------- SECTION shared ---------- */
section{padding:74px 0;border-bottom:1px solid var(--line);}
section:last-of-type{border-bottom:none;}
.section-head{max-width:640px;margin-bottom:40px;}
.section-head h2{font-size:clamp(22px,3vw,30px);margin-top:14px;}
.section-head p{color:var(--text-dim);margin-top:12px;font-size:15px;}

/* ---------- ABOUT ---------- */
.about-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;}
.about-copy p{color:var(--text-dim);margin-bottom:16px;font-size:15px;}
.about-copy strong{color:var(--text);font-weight:600;}
.objectives{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;}
.objectives li{display:flex;gap:14px;padding:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;}
.obj-num{font-family:var(--font-mono);font-size:13px;color:var(--amber);flex:none;width:26px;padding-top:2px;}
.objectives h4{font-size:14px;margin-bottom:4px;}
.objectives span{font-size:13px;color:var(--text-dim);}

/* ---------- DASHBOARD ---------- */
.dash-note{
  display:flex;gap:10px;align-items:flex-start;background:var(--amber-dim);
  border:1px solid rgba(245,166,35,.35);border-radius:10px;padding:13px 16px;
  font-size:13px;color:#f0cf9a;margin-bottom:30px;
}
.dash-note svg{flex:none;margin-top:2px;}
.dash-toolbar{
  display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 20px;margin-bottom:26px;
}
.mode-group{display:flex;gap:6px;background:var(--bg-2);padding:5px;border-radius:9px;border:1px solid var(--line);}
.mode-btn{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;color:var(--text-dim);
  background:transparent;border:none;padding:8px 14px;border-radius:6px;cursor:pointer;transition:all .15s;
}
.mode-btn.active{background:var(--phosphor-dim);color:var(--phosphor);box-shadow:inset 0 0 0 1px rgba(124,255,178,.4);}
.mode-btn[data-mode="EMERGENCY"].active{background:var(--red-dim);color:var(--red);box-shadow:inset 0 0 0 1px rgba(232,92,74,.5);}
.mode-btn[data-mode="HOLD"].active{background:var(--amber-dim);color:var(--amber);box-shadow:inset 0 0 0 1px rgba(245,166,35,.45);}
.mode-btn[data-mode="MANUAL"].active{background:var(--blue-dim);color:var(--blue);box-shadow:inset 0 0 0 1px rgba(107,173,234,.4);}

.toggles{display:flex;gap:22px;flex-wrap:wrap;align-items:center;}
.toggle-item{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--text-dim);}
.switch{position:relative;width:38px;height:21px;flex:none;}
.switch input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:var(--bg-2);border:1px solid var(--line-2);border-radius:99px;cursor:pointer;transition:.2s;}
.slider::before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:var(--text-dim);border-radius:50%;transition:.2s;}
.switch input:checked + .slider{background:var(--phosphor-dim);border-color:rgba(124,255,178,.5);}
.switch input:checked + .slider::before{transform:translateX(17px);background:var(--phosphor);box-shadow:0 0 6px var(--phosphor);}
.switch input:disabled + .slider{opacity:.4;cursor:not-allowed;}

.status-pill{font-family:var(--font-mono);font-size:12px;padding:8px 14px;border-radius:99px;background:var(--phosphor-dim);color:var(--phosphor);border:1px solid rgba(124,255,178,.35);white-space:nowrap;}
.fault-btn{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);background:transparent;border:1px dashed var(--line-2);border-radius:7px;padding:7px 12px;cursor:pointer;}
.fault-btn:hover{border-color:var(--red);color:var(--red);}

.emergency-banner{display:none;align-items:center;gap:10px;background:var(--red-dim);border:1px solid rgba(232,92,74,.5);color:var(--red);padding:12px 16px;border-radius:10px;font-family:var(--font-mono);font-size:13px;margin-bottom:22px;}
.emergency-banner.show{display:flex;}

.dash-grid{display:grid;grid-template-columns:340px 1fr;gap:22px;}
.gauge-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;align-items:center;}
.gauge-card .eyebrow{margin-bottom:6px;}
.gauge-readout{font-family:var(--font-mono);font-size:44px;color:var(--phosphor);text-shadow:0 0 18px rgba(124,255,178,.45);margin-top:-52px;}
.gauge-readout span{font-size:18px;color:var(--text-dim);text-shadow:none;}
.gauge-target{font-size:12px;color:var(--text-dim);margin-top:8px;}
.gauge-sensors{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin-top:14px;text-align:center;}

.meter-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px;align-content:start;}
.meter{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  transition:border-color .15s, transform .15s;
}
.meter:hover{border-color:var(--line-2);transform:translateY(-2px);}
.meter-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.05em;color:var(--text-dim);text-transform:uppercase;display:flex;justify-content:space-between;}
.meter-lcd{
  margin-top:10px;background:var(--bg-2);border-radius:8px;padding:10px 12px;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.45);
}
.meter-value{font-family:var(--font-mono);font-size:23px;color:var(--phosphor);text-shadow:0 0 10px rgba(124,255,178,.35);}
.meter-value span{font-size:12px;color:var(--text-dim);text-shadow:none;margin-left:2px;}
.meter.heat .meter-value{color:var(--amber);text-shadow:0 0 10px rgba(245,166,35,.35);}
.meter.water .meter-value{color:var(--blue);text-shadow:0 0 10px rgba(107,173,234,.35);}
.meter.fault .meter-value{color:var(--red);text-shadow:none;}
.meter.fire .meter-value{color:#ff8a5c;text-shadow:0 0 10px rgba(255,138,92,.35);}
.meter-sub{font-size:10.5px;color:var(--text-dim);margin-top:6px;}

.chart-row{grid-column:1 / -1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 24px;margin-top:22px;}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
.chart-head h4{font-size:14px;}
.chart-readout{font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);}
.chart-readout b{color:var(--phosphor);font-weight:400;}
svg.chart{width:100%;height:auto;overflow:visible;}

/* ---------- SYSTEM ---------- */
.system-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;}
.spec-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;}
.spec-list li{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.spec-list li span:first-child{color:var(--text-dim);}
.spec-list li span:last-child{font-family:var(--font-mono);text-align:right;}
.states{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
.state-chip{display:flex;gap:12px;align-items:flex-start;font-size:13px;}
.state-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;}
.state-chip b{font-family:var(--font-mono);font-size:12px;display:block;}
.state-chip p{color:var(--text-dim);}

/* ---------- EQUIPMENT ---------- */
table.spec-table{width:100%;border-collapse:collapse;font-size:13.5px;}
table.spec-table th{
  text-align:left;font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--text-dim);padding:0 14px 12px;border-bottom:1px solid var(--line-2);font-weight:400;
}
table.spec-table td{padding:14px;border-bottom:1px solid var(--line);vertical-align:middle;}
table.spec-table tr:hover td{background:rgba(255,255,255,.015);}
.instr-name{display:flex;align-items:center;gap:12px;font-weight:600;}
.instr-icon{width:30px;height:30px;flex:none;padding:5px;border:1px solid var(--line-2);border-radius:8px;color:var(--amber);}
td.mono, table.spec-table td:nth-child(3), table.spec-table td:nth-child(4){font-family:var(--font-mono);font-size:12.5px;color:var(--text-dim);}

/* ---------- TEAM / TITLE BLOCK ---------- */
.titleblock{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--panel);}
.tb-row{display:grid;grid-template-columns:180px 1fr;border-bottom:1px solid var(--line);}
.tb-row:last-child{border-bottom:none;}
.tb-label{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:var(--text-dim);padding:16px 18px;border-right:1px solid var(--line);background:var(--bg-2);}
.tb-value{padding:16px 18px;font-size:14px;}
.tb-value small{display:block;color:var(--text-dim);font-size:12px;margin-top:2px;}

footer{padding:34px 0;}

<section id="about">
  <div class="wrap">
    <div class="about-grid">
      <div>
        <div class="eyebrow">ที่มาและวัตถุประสงค์</div>
        <h2 style="margin-top:14px;">ทำไมต้อง “ไฮบริด”</h2>
        <div class="about-copy" style="margin-top:22px;">
          <p>การอบแห้งด้วยแสงอาทิตย์อย่างเดียวควบคุมไม่ได้ในวันที่มีเมฆมาก โดยเฉพาะช่วงฤดูฝนของจังหวัดสุรินทร์ที่ความเข้มแสงลดต่ำและความชื้นอากาศสูงถึง 75–85% ทำให้ผลผลิตแห้งช้าและเสี่ยงต่อเชื้อรา</p>
          <p>โครงงานนี้จึงออกแบบ<strong>โรงเรือนอบแห้งแบบผสมผสาน</strong> ที่ใช้แสงอาทิตย์เป็นพลังงานหลักผ่านหลังคาโพลีคาร์บอเนต และเสริมความร้อนด้วย<strong>เตาชีวมวล (ไม้มะขาม)</strong> ผ่านระบบท่อและ Blower เมื่อรังสีอาทิตย์ไม่เพียงพอ เพื่อรักษาอุณหภูมิให้อยู่ในช่วงที่เหมาะสมได้อย่างต่อเนื่อง</p>
          <p>ทุกจุดวัดเชื่อมกับ <strong>ESP32 WiFi Node32S</strong> ที่ประมวลผลและควบคุม Blower/พัดลมระบายอากาศโดยอัตโนมัติ พร้อมส่งข้อมูลขึ้นแสดงผลผ่านมือถือและเว็บ — ซึ่งเป็นที่มาของแดชบอร์ดในหน้านี้</p>
        </div>
      </div>
      <ul class="objectives">
        <li><span class="obj-num">01</span><div><h4>ออกแบบและสร้างโรงเรือน</h4><span>หลังคาทรงจั่ว 70×110 ซม. ทำงานร่วมกับเตาชีวมวลด้วยระบบความร้อนร่วม</span></div></li>
        <li><span class="obj-num">02</span><div><h4>ควบคุมอุณหภูมิและความเร็วลม</h4><span>ทดสอบการควบคุมความเร็วลมในช่วง 0.3–1.5 m/s ภายใต้สภาวะทำงานจริง</span></div></li>
        <li><span class="obj-num">03</span><div><h4>ศึกษาสมรรถนะเชิงความร้อน</h4><span>วิเคราะห์การกระจายอุณหภูมิและความสม่ำเสมอระหว่างตำแหน่งต่าง ๆ ในโรงเรือน</span></div></li>
        <li><span class="obj-num">04</span><div><h4>ศึกษาจลนศาสตร์การอบแห้ง</h4><span>ประเมินการลดลงของน้ำหนัก–ความชื้น เทียบกับแบบจำลอง thin-layer drying</span></div></li>
      </ul>
    </div>
  </div>
</section>

<script>
(function(){
  // ---------- state ----------
  var state = {
    mode:'AUTO',
    blower:true,
    fan:false,
    t:[56,58,54,57],
    faulted:[false,false,false,false],
    rh:[37,41,79],
    k1:320,
    k2:92,
    wind:0.9,
    light:560,
    curveT:0 // 0..1 progress along the 9h drying curve
  };
  var TARGET_LOW=50, TARGET_HIGH=60, GMIN=20, GMAX=90;

  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function walk(v,step,min,max){return clamp(v+(Math.random()*2-1)*step,min,max);}
  function fmt(v,d){return v.toFixed(d===undefined?1:d);}

  // ---------- gauge geometry ----------
  var gaugeFill=document.getElementById('gaugeFill');
  var gaugeLen=gaugeFill.getTotalLength();
  gaugeFill.style.strokeDasharray=gaugeLen;

  function angleFor(v){ var f=clamp((v-GMIN)/(GMAX-GMIN),0,1); return 180-f*180; }
  function tickCoords(v){
    var theta=angleFor(v)*Math.PI/180, cx=100, cy=100;
    var r1=72,r2=90;
    return {x1:cx+r1*Math.cos(theta), y1:cy-r1*Math.sin(theta), x2:cx+r2*Math.cos(theta), y2:cy-r2*Math.sin(theta)};
  }
  ['tick50','tick60'].forEach(function(id){
    var v = id==='tick50'?50:60;
    var c=tickCoords(v), el=document.getElementById(id);
    el.setAttribute('x1',c.x1);el.setAttribute('y1',c.y1);el.setAttribute('x2',c.x2);el.setAttribute('y2',c.y2);
  });

  function setGauge(v){
    var f=clamp((v-GMIN)/(GMAX-GMIN),0,1);
    gaugeFill.style.strokeDashoffset = gaugeLen*(1-f);
    var color = (v>=TARGET_LOW &amp;&amp; v<=TARGET_HIGH) ? '#7cffb2' : (v>TARGET_HIGH ? '#e85c4a' : '#f5a623');
    gaugeFill.style.stroke=color;
    document.getElementById('avgTempReadout').innerHTML=fmt(v)+'<span>°C</span>';
    document.getElementById('avgTempReadout').style.color=color;
  }

  // ---------- moisture ratio curve (thin-layer exponential demo) ----------
  var N=73, pts=[];
  for(var i=0;i<N;i++){
    var hours = i/(N-1)*9;
    var mr = Math.exp(-0.30*hours)*100;
    var x = 40 + (i/(N-1))*550;
    var y = 150 - (mr/100)*140;
    pts.push([x,y,mr,hours]);
  }
  document.getElementById('mrCurve').setAttribute('points', pts.map(function(p){return p[0]+','+p[1];}).join(' '));

  function curvePointAt(t){
    var idx = t*(N-1);
    var i0=Math.floor(idx), i1=Math.min(N-1,i0+1), f=idx-i0;
    var p0=pts[i0], p1=pts[i1];
    return { x:p0[0]+(p1[0]-p0[0])*f, y:p0[1]+(p1[1]-p0[1])*f, mr:p0[2]+(p1[2]-p0[2])*f, h:p0[3]+(p1[3]-p0[3])*f };
  }

  // ---------- DOM refs ----------
  var meterEls={
    T1:document.querySelector('#meterT1 .meter-value'),
    T2:document.querySelector('#meterT2 .meter-value'),
    T3:document.querySelector('#meterT3 .meter-value'),
    T4:document.querySelector('#meterT4 .meter-value'),
    RH1:document.querySelector('#meterRH1 .meter-value'),
    RH2:document.querySelector('#meterRH2 .meter-value'),
    RH3:document.querySelector('#meterRH3 .meter-value'),
    K1:document.querySelector('#meterK1 .meter-value'),
    K2:document.querySelector('#meterK2 .meter-value'),
    WIND:document.querySelector('#meterWind .meter-value'),
    LIGHT:document.querySelector('#meterLight .meter-value')
  };
  var statusPill=document.getElementById('statusPill');
  var emergencyBanner=document.getElementById('emergencyBanner');
  var blowerToggle=document.getElementById('blowerToggle');
  var fanToggle=document.getElementById('fanToggle');
  var activeSensorCount=document.getElementById('activeSensorCount');

  function updateStatusPill(){
    var labels={AUTO:'สถานะ: AUTO · กำลังอบแห้ง',MANUAL:'สถานะ: MANUAL · ควบคุมโดยผู้ใช้',HOLD:'สถานะ: HOLD · รอยืนยันจบรอบ',EMERGENCY:'สถานะ: EMERGENCY LOCK'};
    statusPill.textContent=labels[state.mode];
    var colors={AUTO:['var(--phosphor-dim)','var(--phosphor)'],MANUAL:['var(--blue-dim)','var(--blue)'],HOLD:['var(--amber-dim)','var(--amber)'],EMERGENCY:['var(--red-dim)','var(--red)']};
    statusPill.style.background=colors[state.mode][0];
    statusPill.style.color=colors[state.mode][1];
    emergencyBanner.classList.toggle('show', state.mode==='EMERGENCY');
    blowerToggle.disabled = state.mode!=='MANUAL';
    fanToggle.disabled = state.mode!=='MANUAL';
  }

  document.getElementById('modeGroup').addEventListener('click', function(e){
    var btn=e.target.closest('.mode-btn'); if(!btn) return;
    document.querySelectorAll('.mode-btn').forEach(function(b){b.classList.remove('active');});
    btn.classList.add('active');
    state.mode=btn.dataset.mode;
    if(state.mode==='EMERGENCY'){ state.blower=false; state.fan=false; blowerToggle.checked=false; fanToggle.checked=false; }
    updateStatusPill();
  });
  blowerToggle.addEventListener('change', function(){ state.blower=blowerToggle.checked; });
  fanToggle.addEventListener('change', function(){ state.fan=fanToggle.checked; });

  document.getElementById('faultBtn').addEventListener('click', function(){
    state.faulted[2]=!state.faulted[2];
    var el=document.getElementById('meterT3');
    el.classList.toggle('fault', state.faulted[2]);
  });

  // ---------- simulation tick ----------
  function tick(){
    if(state.mode!=='EMERGENCY'){
      // temps drift toward target band, biased by blower state
      for(var i=0;i<4;i++){
        if(state.faulted[i]) continue;
        var bias = state.blower ? 0.35 : -0.5;
        state.t[i]=walk(state.t[i]+bias*0.4, 0.7, 30, 78);
      }
      state.rh[0]=walk(state.rh[0]-(state.fan?0.6:0.05), 1.1, 22, 55);
      state.rh[1]=walk(state.rh[1]-(state.fan?0.5:0.05), 1.1, 22, 58);
      state.rh[2]=walk(state.rh[2], 1.4, 68, 88);
      state.k1=walk(state.k1+(state.blower?0.6:-1.2), 6, 180, 480);
      state.k2=walk(state.k2+(state.blower?0.15:-0.3), 2.2, 55, 130);
      state.wind=walk(state.wind, state.blower?0.06:0.02, state.blower?0.3:0.05, 1.5);
      state.light=walk(state.light,45,0,980);

      if(state.mode==='AUTO'){
        var avgNow = avgTemps();
        state.blower = avgNow < TARGET_HIGH-1;
        blowerToggle.checked=state.blower;
        state.fan = state.rh[0] > 45;
        fanToggle.checked=state.fan;
      }
      if(state.mode!=='HOLD'){
        state.curveT = (state.curveT + 0.0016) % 1;
      }
    }

    var avg=avgTemps();
    setGauge(avg);
    var activeN = state.faulted.filter(function(f){return !f;}).length;
    activeSensorCount.textContent='ใช้งาน '+activeN+'/4 เซนเซอร์';

    ['T1','T2','T3','T4'].forEach(function(k,i){
      var el=meterEls[k];
      if(state.faulted[i]){ el.innerHTML='‑‑‑<span>FAULT</span>'; }
      else { el.innerHTML=fmt(state.t[i])+'<span>°C</span>'; }
    });
    meterEls.RH1.innerHTML=fmt(state.rh[0])+'<span>%RH</span>';
    meterEls.RH2.innerHTML=fmt(state.rh[1])+'<span>%RH</span>';
    meterEls.RH3.innerHTML=fmt(state.rh[2])+'<span>%RH</span>';
    meterEls.K1.innerHTML=fmt(state.k1,0)+'<span>°C</span>';
    meterEls.K2.innerHTML=fmt(state.k2,0)+'<span>°C</span>';
    meterEls.WIND.innerHTML=fmt(state.wind,2)+'<span>m/s</span>';
    meterEls.LIGHT.innerHTML=fmt(state.light,0)+'<span>W/m²</span>';

    var cp=curvePointAt(state.curveT);
    document.getElementById('mrCursor').setAttribute('cx',cp.x);
    document.getElementById('mrCursor').setAttribute('cy',cp.y);
    document.getElementById('chartMR').textContent=fmt(cp.mr,0)+'%';
    var hh=Math.floor(cp.h), mm=Math.round((cp.h-hh)*60);
    document.getElementById('chartTime').textContent=hh+'h '+(mm<10?'0':'')+mm+'m';
  }

  function avgTemps(){
    var sum=0,n=0;
    state.t.forEach(function(v,i){ if(!state.faulted[i]){sum+=v;n++;} });
    return n?sum/n:0;
  }

  updateStatusPill();
  tick();
  setInterval(tick, 1800);
})();
</script>

  <script>
    var modal = document.getElementById("myModal");
    var btn = document.getElementById("openModalBtn");
    var closeBtn = document.getElementById("closeBtn");
    var frame = document.getElementById("dashFrame");
    var loaded = false;

    function openModal(){
      if(!loaded){
        var html = document.getElementById('dashboardSrc').value;
        frame.srcdoc = html;
        loaded = true;
      }
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }
    function closeModal(){
      modal.classList.remove("show");
      document.body.style.overflow = "";
    }

    btn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", function(e){
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
    });
  </script>
