<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>โรงเรือนอบแห้งพลังงานแสงอาทิตย์ร่วมกับเชื้อเพลิงชีวมวล</title>
<style>
  :root{
    --bg:#12151a;
    --panel:#1b2028;
    --line:rgba(237,235,227,.09);
    --line-2:rgba(237,235,227,.16);
    --text:#edebe3;
    --text-dim:#98a1ac;
    --amber:#f5a623;
  }
  *{box-sizing:border-box;}
  body{
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    background:
      radial-gradient(circle at 82% 8%, rgba(245,166,35,.10), transparent 46%),
      var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    text-align: center;
    padding: 24px;
  }

  .intro-eyebrow{
    font-family: 'Share Tech Mono', monospace;
    font-size: 12.5px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--amber);
    margin-bottom: 14px;
  }

  h1{
    font-size: clamp(20px, 3vw, 30px);
    max-width: 620px;
    line-height: 1.4;
    margin: 0 0 8px;
  }
  h1 em{ font-style: normal; color: var(--amber); }

  .intro-sub{
    color: var(--text-dim);
    font-size: 14px;
    max-width: 480px;
    margin-bottom: 34px;
  }

  .open-btn {
    padding: 15px 30px;
    background-color: var(--amber);
    color: #1a1406;
    border: none;
    border-radius: 8px;
    font-size: 17px;
    cursor: pointer;
    font-weight: 700;
    box-shadow: 0 4px 14px rgba(245,166,35,.25);
    transition: 0.2s;
  }
  .open-btn:hover {
    background-color: #ffb640;
    transform: translateY(-2px);
  }
  .open-btn:active{ transform: translateY(0); }

  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    inset: 0;
    background-color: rgba(0, 0, 0, 0.82);
    backdrop-filter: blur(2px);
  }
  .modal.show{ display: block; }

  .modal-content {
    position: relative;
    margin: 2vh auto;
    width: 96%;
    max-width: 1280px;
    height: 96vh;
    background-color: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }

  .close-btn {
    position: absolute;
    top: 12px;
    right: 18px;
    color: #fff;
    font-size: 32px;
    line-height: 1;
    font-weight: bold;
    cursor: pointer;
    z-index: 1001;
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(0,0,0,.35);
    transition: background .15s, color .15s;
  }
  .close-btn:hover { color: #e85c4a; background: rgba(0,0,0,.55); }

  iframe {
    width: 100%;
    height: 100%;
    border: none;
    display: block;
    background: #12151a;
  }
</style>
</head>
<body>

  <div class="intro-eyebrow">Solar–Biomass Dryer · Monitoring System</div>
  <h1>โรงเรือนอบแห้งพลังงาน<em>แสงอาทิตย์</em>ร่วมกับเชื้อเพลิงชีวมวล</h1>
  <p class="intro-sub">คลิกปุ่มด้านล่างเพื่อเปิดแดชบอร์ดตรวจวัดข้อมูลเซนเซอร์แบบเรียลไทม์ในหน้าต่างป๊อปอัป</p>

  <button id="openModalBtn" class="open-btn">เปิดแดชบอร์ดเตาอบชีวมวล</button>

  <div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeBtn" title="ปิด">&times;</span>
      <iframe id="dashFrame" src="dash.html" title="Solar-Biomass Dryer Dashboard"></iframe>
    </div>
  </div>

  <script>
    var modal = document.getElementById("myModal");
    var btn = document.getElementById("openModalBtn");
    var closeBtn = document.getElementById("closeBtn");
    var frame = document.getElementById("dashFrame");
    var DASH_SRC = "dash.html";

    function openModal(){
      if(!frame.src || frame.src.indexOf(DASH_SRC) === -1){
        frame.src = DASH_SRC;
      }
      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }
    function closeModal(){
      modal.classList.remove("show");
      document.body.style.overflow = "";
    }

    btn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", function(e){
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", function(e){
      if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
    });
  </script>

</body>
</html>
